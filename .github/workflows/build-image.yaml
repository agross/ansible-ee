name: Build image

on:
  push:
  workflow_dispatch:

# Serialize builds that can publish the same release tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    name: Build image
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Get latest code
        uses: actions/checkout@v7.0.1

      - name: Read Ansible version
        id: ansible
        run: |
          version=$(sed -n 's/^ARG ANSIBLE_CORE_VERSION=//p' Dockerfile)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select next release tag
        if: github.ref_name == github.event.repository.default_branch
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
          version: ${{ steps.ansible.outputs.version }}
        run: |
          next=$(gh api --paginate --slurp \
            "/users/${OWNER}/packages/container/${REPOSITORY}/versions?per_page=100" |
            jq --arg prefix "${version}-" '
              [.[].[] | .metadata.container.tags[]?
               | select(startswith($prefix)) | ltrimstr($prefix)
               | select(test("^[0-9]+$")) | tonumber] | (max // 0) + 1')
          echo "tag=${version}-${next}" >> "$GITHUB_OUTPUT"

      - name: Get Ansible release notes
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.ansible.outputs.version }}
        run: |
          gh api "repos/ansible/ansible/releases/tags/v${version}" \
            --jq '"Ansible release: " + .html_url + "\n\n" + .body' > "$RUNNER_TEMP/ansible-release-notes.md"

      - name: Extract metadata from build
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          # Generate Docker tags based on the following events/attributes.
          # https://github.com/docker/metadata-action#tags-input
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=raw,value=${{ steps.release.outputs.tag }},enable={{ is_default_branch }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --notes-file "$RUNNER_TEMP/ansible-release-notes.md"
