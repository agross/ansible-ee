name: Lint

on:
  push:

# Cancel previous runs when a new commit is pushed.
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  ansible-ee-version:
    name: Ansible EE Version
    runs-on: ubuntu-latest

    env:
      # renovate: pypi=ansible-core
      version: 2.22.0

    steps:
      - name: Get latest code
        uses: actions/checkout@v7.0.1

      - name: Build image
        run: docker build --tag ansible-ee:test .

      - name: Verify Ansible version matches image version
        run: |
          expect="${{ env.version }}"

          actual="$(docker container \
                           run \
                           --rm \
                           ansible-ee:test \
                           ansible --version |
                    grep --fixed-strings 'ansible [core ')"
          actual="${actual##*core }"
          actual="${actual%%]*}"

          echo "expect=$expect, actual=$actual"
          [[ "$expect" == "$actual" ]]
